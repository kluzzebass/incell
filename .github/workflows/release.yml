name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.SIGN_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" ]]; then
            echo "Missing SIGN_CERT_P12_BASE64 secret" >&2
            exit 1
          fi
          KEYCHAIN=build.keychain
          echo "$CERT_P12_BASE64" | base64 --decode > signing.p12
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import signing.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$TEAM_ID" || -z "$NOTARY_PASSWORD" || -z "$NOTARY_PROFILE" ]]; then
            echo "Missing notarization secrets" >&2
            exit 1
          fi
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build, sign, notarize, package
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          if [[ -z "$SIGN_IDENTITY" ]]; then
            echo "Missing SIGN_IDENTITY secret" >&2
            exit 1
          fi
          ./scripts/release_cask.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/Incell-*.zip
            dist/cask.rb

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart("v")
          go build -ldflags="-H windowsgui -X incell/internal/version.Version=$VERSION" -o "dist/Incell-${VERSION}-windows.exe" ./cmd/incell

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -ldflags="-X incell/internal/version.Version=$VERSION" -o "dist/Incell-${VERSION}-linux-amd64" ./cmd/incell
          chmod +x "dist/Incell-${VERSION}-linux-amd64"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/Incell-*-linux-*

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build WASM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GOOS=js GOARCH=wasm go build -ldflags="-X incell/internal/version.Version=$VERSION" -o "dist/Incell-${VERSION}.wasm" ./cmd/incell

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: dist/*.wasm

  release:
    needs: [build-macos, build-windows, build-linux, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          # Create release if it doesn't exist
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Automated release" --latest

          # Upload macOS zip
          for f in artifacts/macos-build/Incell-*.zip; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done

          # Upload Windows executable
          for f in artifacts/windows-build/*.exe; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done

          # Upload Linux binary
          for f in artifacts/linux-build/Incell-*-linux-*; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done

          # Upload WASM binary
          for f in artifacts/wasm-build/*.wasm; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done

      - name: Update tap repository
        env:
          TAP_REPO: ${{ secrets.HOMEBREW_TAP_REPO }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAP_REPO="${TAP_REPO:-kluzzebass/homebrew-tap}"
          if [[ -z "$TAP_TOKEN" ]]; then
            echo "Missing TAP_TOKEN secret" >&2
            exit 1
          fi
          TAP_DIR="$(mktemp -d)"
          git clone "https://$TAP_TOKEN@github.com/$TAP_REPO.git" "$TAP_DIR"
          mkdir -p "$TAP_DIR/Casks"
          cp artifacts/macos-build/cask.rb "$TAP_DIR/Casks/incell.rb"
          cd "$TAP_DIR"
          git add Casks/incell.rb
          if git diff --cached --quiet; then
            echo "Tap already up to date."
            exit 0
          fi
          VERSION="$(ruby -ne 'puts $1 if $_ =~ /version \"([^\"]+)\"/' Casks/incell.rb | head -n 1)"
          git -c user.name="github-actions" -c user.email="github-actions@github.com" \
            commit -m "Update incell cask to ${VERSION}"
          git push
