name: Deploy to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Get latest version
        id: version
        run: |
          VERSION=$(gh release view --json tagName -q '.tagName' 2>/dev/null || echo "dev")
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build WASM
        run: |
          mkdir -p dist
          GOOS=js GOARCH=wasm go build -ldflags="-X incell/internal/version.Version=${{ steps.version.outputs.version }}" -o dist/incell.wasm ./cmd/incell
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" dist/
          cp internal/assets/icon.png dist/favicon.png
          cat > dist/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Incell - FreeCell with a twist</title>
              <link rel="icon" type="image/png" href="favicon.png">
              <style>
                  * { margin: 0; padding: 0; box-sizing: border-box; }
                  html, body { height: 100%; background: #1a1a2e; overflow: hidden; }
              </style>
          </head>
          <body>
              <script src="wasm_exec.js"></script>
              <script>
                  const go = new Go();
                  WebAssembly.instantiateStreaming(fetch("incell.wasm"), go.importObject)
                      .then(result => go.run(result.instance));
              </script>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
